name: Verify & Deploy Gemini Brain MCP to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "rpi-sync/**"
      - "**.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "rpi-sync/**"
      - "**.md"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, Unit & Security Invariant Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Generate Cloudflare runtime types & verify TypeScript
        run: |
          npx wrangler types
          npm run typecheck

      - name: Run Vitest unit, OAuth security, ranking & DO rollback tests
        run: npm test

  deploy:
    name: Deploy Worker & Read-Only Production Smoke Check (brain.tsimon.me)
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Deploy Worker & BrainMemoryDO to Cloudflare Edge
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live MCP Discovery Card & version sync on brain.tsimon.me
        env:
          MCP_BEARER_TOKEN: ${{ secrets.MCP_BEARER_TOKEN }}
        run: |
          echo "Verifying active Worker deployment via Cloudflare API..."
          npx wrangler deployments list
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          echo "Expected package.json version: ${EXPECTED_VERSION}"
          echo "Waiting 5s for edge route propagation..."
          sleep 5
          HTTP_STATUS=$(curl -s -o /tmp/card.json -w "%{http_code}" \
            -H "Accept: application/json" \
            https://brain.tsimon.me/server-card)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            cat /tmp/card.json
            echo ""
            LIVE_VERSION=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('/tmp/card.json','utf8')).version || '');")
            if [ "$LIVE_VERSION" != "$EXPECTED_VERSION" ]; then
              echo "::error::Version mismatch: live /server-card reports '${LIVE_VERSION}' != package.json '${EXPECTED_VERSION}'"
              exit 1
            fi
            echo "Live MCP Discovery Card verified (HTTP 200, v${LIVE_VERSION})."
          elif [ "$HTTP_STATUS" -eq 403 ] && grep -qi "Just a moment" /tmp/card.json; then
            echo "::notice::Cloudflare Bot Fight Mode / Managed Challenge (HTTP 403) gated the GitHub Actions datacenter runner IP. Worker deployment was verified via the Cloudflare API above."
          else
            cat /tmp/card.json
            echo "::error::Health check failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
